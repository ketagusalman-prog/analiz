<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>M4 | Merkezi Sayfa Raporlayıcı</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f8fafc; --primary: #0f172a; --accent: #3b82f6; }
        body { background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; padding: 30px; }
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .report-card { background: white; padding: 20px; border-radius: 15px; border: 1px solid #e2e8f0; }
        .report-card h3 { font-size: 14px; color: #64748b; margin-bottom: 15px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        .data-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px border #f8fafc; font-size: 13px; }
        .status-badge { padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: 700; }
        .loading { color: var(--accent); font-weight: 700; }
    </style>
</head>
<body>

    <div style="margin-bottom: 30px;">
        <h1 style="font-weight: 800; font-size: 24px;">📊 Sayfa Bazlı Konsolide Rapor</h1>
        <p style="color: #64748b;">Diğer dosyalardan anlık veri çekiliyor...</p>
    </div>

    <div class="grid-container">
        <!-- ANALİZ SAYFASI VERİLERİ -->
        <div class="report-card" id="analiz-kutu">
            <h3>📈 Analiz Sayfası Özeti</h3>
            <div id="analiz-content" class="loading">Bağlanıyor...</div>
        </div>

        <!-- PERSONEL SAYFASI VERİLERİ -->
        <div class="report-card" id="personel-kutu">
            <h3>👤 Personel Performansları</h3>
            <div id="personel-content" class="loading">Bağlanıyor...</div>
        </div>

        <!-- TAKİP İZİN SAYFASI VERİLERİ -->
        <div class="report-card" id="takip-kutu">
            <h3>📅 Güncel İzin Durumu</h3>
            <div id="takip-content" class="loading">Bağlanıyor...</div>
        </div>
    </div>

    <script>
        // Sayfalardan veri çekme fonksiyonu
        async function sayfaVerisiCek(url, elementId, selector) {
            try {
                const response = await fetch(url);
                const text = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                
                // İlgili sayfadaki tabloyu veya veriyi bul
                const data = doc.querySelector(selector);
                const target = document.getElementById(elementId);

                if (data) {
                    target.innerHTML = data.innerHTML;
                    target.classList.remove('loading');
                } else {
                    target.innerHTML = "Veri formatı uyumsuz.";
                }
            } catch (error) {
                document.getElementById(elementId).innerHTML = "Sayfaya ulaşılamadı.";
                console.error(url + " çekilemedi:", error);
            }
        }

        // Sayfalar yüklendiğinde diğer sayfalara bağlan
        window.onload = () => {
            // Analiz.html'deki tablo gövdesini çek
            sayfaVerisiCek('analiz.html', 'analiz-content', '#tbody'); 
            
            // Personel.html'deki listeyi çek
            sayfaVerisiCek('personel.html', 'personel-content', '#personel-listesi'); 
            
            // Takipizin.html'deki izin verilerini çek
            sayfaVerisiCek('takipizin.html', 'takip-content', '#izin-listesi');
        };
    </script>
</body>
</html>
