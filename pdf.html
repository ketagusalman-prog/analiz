<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Profesyonel Rapor Düzenleyici</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --accent: #2563eb; }
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            #reportContent { display: block !important; margin: 0; padding: 0; }
        }
        #reportContent { display: none; }
        .highlight { color: var(--accent); font-weight: 700; }
        /* Düzenlenebilir alan stili */
        #editor { min-height: 250px; border: 1px solid #d1d5db; border-radius: 8px; padding: 15px; outline: none; background: white; }
    </style>
</head>
<body class="bg-gray-100 p-8">

    <div id="inputSection" class="no-print max-w-3xl mx-auto bg-white p-8 rounded-xl shadow-md">
        <h2 class="text-xl font-bold mb-4">Rapor Düzenleyici</h2>
        
        <div class="mb-2 flex gap-2">
            <button onclick="execCmd('bold')" class="bg-gray-200 px-3 py-1 rounded font-bold">B</button>
            <button onclick="execCmd('italic')" class="bg-gray-200 px-3 py-1 rounded italic">I</button>
            <button onclick="execCmd('foreColor', '#2563eb')" class="bg-blue-100 px-3 py-1 rounded text-blue-600 font-bold">Vurgula</button>
        </div>

        <div id="editor" contenteditable="true" class="mb-4">M4 Mağazası Durum Raporu...</div>
        
        <button onclick="renderAndPrint()" style="background:var(--accent); color:white; border:none; padding:12px 20px; border-radius:12px; font-weight:700; cursor:pointer; width:100%;">
            📄 PDF Raporu Al
        </button>
    </div>

    <div id="reportContent" class="p-12 bg-white max-w-3xl mx-auto"></div>

    <script>
        // Metin biçimlendirme komutları
        function execCmd(command, value = null) {
            document.execCommand(command, false, value);
        }

        function renderAndPrint() {
            const editorContent = document.getElementById('editor').innerHTML;
            const reportDiv = document.getElementById('reportContent');
            
            // Editördeki HTML'i doğrudan rapor alanına aktar
            reportDiv.innerHTML = `<div class="prose max-w-none">${editorContent}</div>`;
            reportDiv.style.display = 'block';
            
            window.print();
            
            reportDiv.style.display = 'none';
        }
    </script>
</body>
</html>
